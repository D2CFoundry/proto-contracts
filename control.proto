syntax = "proto3";

package control;

// Tells protoc where the Go files should end up
option go_package = "proto-contracts/control";

service SFUControl {
  // The single bidirectional stream.
  // Both Client (SFU) and Server (Iris) use the `Message` type.
  rpc Connect(stream Message) returns (stream Message);
}

// This is the top-level wrapper that encapsulates every possible message.
// We have a single stream so every message must be of this type,
// We are using `oneof` to figure out what the actual payload is based on the payload type.
message Message {
  oneof payload {
    // Iris -> SFU
    JoinRoomRequest join_room = 1;
    LeaveRoomRequest leave_room = 2;
    PublisherOffer publisher_offer = 3;
    SubscriberAnswer subscriber_answer = 4;
    ICECandidatePayload client_publisher_ice = 5;
    ICECandidatePayload client_subscriber_ice = 6;

    // SFU -> Iris
    PublisherAnswer publisher_answer = 7;
    SubscriberOffer subscriber_offer = 8;
    ICECandidatePayload sfu_publisher_ice = 9;
    ICECandidatePayload sfu_subscriber_ice = 10;
    JoinRoomAck join_room_ack = 11;
    LeaveRoomAck leave_room_ack = 12;
    MediaPublishedEvent media_published = 13;
    MediaUnpublishedEvent media_unpublished = 14;
    SubscriberAnswerAck subscriber_answer_ack = 15;

    // SFU -> Iris
    // Status messages.
    HealthPing health_ping = 16;
  }
}

// GENERIC TYPES

message SDPPayload {
  string type = 1; // "offer" or "answer"
  string sdp = 2;
}

message ICECandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_mline_index = 3;
}


// ACTUAL MESSAGES

message ICECandidatePayload {
  string room_id = 1;
  string client_id = 2;
  ICECandidate candidate = 3;
}

message JoinRoomRequest {
  string room_id = 1;
  string client_id = 2;
}

message JoinRoomAck {
  string room_id = 1;
  string client_id = 2;
  bool success = 3;
  string error_message = 4;
}

message LeaveRoomRequest {
  string room_id = 1;
  string client_id = 2;
}

message LeaveRoomAck {
  string room_id = 1;
  string client_id = 2;
  bool success = 3;
  string error_message = 4;
}

message PublisherOffer {
  string request_id = 1; // Used to correlate the asynchronous response
  string room_id = 2;
  string client_id = 3;
  SDPPayload sdp = 4;
}

message SubscriberAnswer {
  string room_id = 1;
  string client_id = 2;
  SDPPayload sdp = 3;
}

message SubscriberAnswerAck {
  string room_id = 1;
  string client_id = 2;
  bool success = 3;
  string error_message = 4;
}

message PublisherAnswer {
  string request_id = 1; // Matches the request_id from PublisherOfferRequest
  string room_id = 2;
  string client_id = 3;
  SDPPayload sdp = 4;
  bool success = 5;
  string error_message = 6;
}

message SubscriberOffer {
  string room_id = 1;
  string client_id = 2;
  SDPPayload sdp = 3;
}

message MediaPublishedEvent {
  string room_id = 1;
  string client_id = 2;
  string mid = 3;
  string publisher_id = 4;
}

message MediaUnpublishedEvent {
  string room_id = 1;
  string client_id = 2;
  string mid = 3;
}


// HEALTH MESSAGES

message HealthPing {
  string sfu_id = 1;
  float cpu_usage = 2;
  int32 active_rooms = 3;
  string status_label = 4;
}